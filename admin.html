<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - SUTE Jubilados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-admin { border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 10px; }
        .header-admin { background-color: #0056b3; color: white; border-radius: 10px 10px 0 0; padding: 1.5rem; }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-admin">
                    <div class="header-admin text-center">
                        <h2 class="mb-1"><i class="bi bi-shield-lock-fill me-2"></i>Panel de Publicación</h2>
                        <p class="mb-0 text-light small">Sindicato Único de Trabajadores de la Educación</p>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4">
                            <label for="ghToken" class="form-label fw-bold">Token de Acceso a GitHub</label>
                            <input type="password" class="form-control" id="ghToken" placeholder="Pega aquí tu token (ghp_... o github_pat_...)">
                            <div class="form-text">Ingresa tu Token personal para autorizar las publicaciones en el sitio web.</div>
                        </div>

                        <hr class="my-4">

                        <form id="formPublicar">
                            <div class="mb-3">
                                <label for="seccionDestino" class="form-label fw-bold">Sección de Destino</label>
                                <select class="form-select" id="seccionDestino" required>
                                    <option value="_noticias">📰 Noticias</option>
                                    <option value="_galeria">📸 Galería de Fotos</option>
                                    <option value="_literatura">📚 Literatura y Poesía</option>
                                    <option value="_documentos">📄 Documentos / Archivos</option>
                                    <option value="_humor">😄 Humor</option>
                                    <option value="_deportes">🏆 Deportes</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-bold">Título de la Publicación / Foto</label>
                                <input type="text" class="form-control" id="titulo" placeholder="Escribe un título claro..." required>
                            </div>

                            <div class="mb-3">
                                <label for="contenido" class="form-label fw-bold">Descripción o Contenido</label>
                                <textarea class="form-control" id="contenido" rows="5" placeholder="Escribe una breve descripción o texto..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="enlaceAdjunto" class="form-label fw-bold">Enlace directo a la Foto (Postimages) o Adjunto</label>
                                <input type="url" class="form-control" id="enlaceAdjunto" placeholder="https://i.postimg.cc/xxxxx/foto.jpg">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnPublicar">
                                <i class="bi bi-rocket-takeoff-fill me-2"></i>🚀 Publicar en el Sitio Web
                            </button>
                        </form>

                        <div id="mensajeResultado" class="mt-4"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REPO_USER = 'lfuentesu';
        const REPO_NAME = 'sute-jubilados';

        document.addEventListener('DOMContentLoaded', () => {
            const tokenGuardado = localStorage.getItem('sute_github_token');
            if (tokenGuardado) {
                document.getElementById('ghToken').value = tokenGuardado;
            }
        });

        document.getElementById('formPublicar').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('ghToken').value.trim();
            const carpeta = document.getElementById('seccionDestino').value;
            const titulo = document.getElementById('titulo').value.trim();
            const contenido = document.getElementById('contenido').value.trim();
            const enlace = document.getElementById('enlaceAdjunto').value.trim();
            const mensajeDiv = document.getElementById('mensajeResultado');
            const btn = document.getElementById('btnPublicar');

            if (!token) {
                mensajeDiv.innerHTML = '<div class="alert alert-warning text-center">Por favor, ingresa tu Token de GitHub en la casilla superior.</div>';
                return;
            }

            localStorage.setItem('sute_github_token', token);

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Publicando en la web...';
            mensajeDiv.innerHTML = '';

            const hoy = new Date();
            const fechaTxt = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;

            let mdContent = `# ${titulo}\n\n*Fecha:* ${fechaTxt}\n\n${contenido}`;
            
            if (enlace) {
                if (carpeta === '_galeria' || enlace.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                    mdContent += `\n\n![${titulo}](${enlace})\n\n[Ver imagen a tamaño completo](${enlace})`;
                } else {
                    mdContent += `\n\n[Ver adjunto / enlace relacionado](${enlace})`;
                }
            }

            const timestamp = Date.now();
            const nombreArchivo = `post_${timestamp}.md`;
            const rutaArchivo = `${carpeta}/${nombreArchivo}`;

            const base64Content = btoa(unescape(encodeURIComponent(mdContent)));

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${rutaArchivo}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Nueva publicacion: ${titulo}`,
                        content: base64Content
                    })
                });

                if (res.ok) {
                    mensajeDiv.innerHTML = '<div class="alert alert-success text-center">✅ <strong>¡Publicado con éxito!</strong> El contenido ha sido enviado a la web. En 1 o 2 minutos se actualizará la página.</div>';
                    document.getElementById('titulo').value = '';
                    document.getElementById('contenido').value = '';
                    document.getElementById('enlaceAdjunto').value = '';
                } else {
                    const errData = await res.json();
                    if (res.status === 401) {
                        mensajeDiv.innerHTML = '<div class="alert alert-danger text-center">❌ <strong>Token no válido o vencido.</strong> Revisa el Token ingresado.</div>';
                    } else {
                        mensajeDiv.innerHTML = `<div class="alert alert-danger text-center">❌ Error al publicar: ${errData.message || 'Verifica la conexión.'}</div>`;
                    }
                }
            } catch (err) {
                console.error(err);
                mensajeDiv.innerHTML = '<div class="alert alert-danger text-center">❌ Error de conexión al publicar.</div>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-rocket-takeoff-fill me-2"></i>🚀 Publicar en el Sitio Web';
            }
        });
    </script>
</body>
</html>
