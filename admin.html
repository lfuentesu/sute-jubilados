<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - SUTE Jubilados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-admin { border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 10px; }
        .header-admin { background-color: #0056b3; color: white; border-radius: 10px 10px 0 0; padding: 1.5rem; }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-admin">
                    <div class="header-admin text-center">
                        <h2 class="mb-1"><i class="bi bi-shield-lock-fill me-2"></i>Panel de Publicación</h2>
                        <p class="mb-0 text-light small">Sindicato Único de Trabajadores de la Educación</p>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4">
                            <label for="ghToken" class="form-label fw-bold">Token de Acceso a GitHub</label>
                            <input type="password" class="form-control" id="ghToken" placeholder="Pega aquí tu token (ghp_... o github_pat_...)">
                            <div class="form-text">Ingresa tu Token personal para autorizar las publicaciones en el sitio web.</div>
                        </div>

                        <hr class="my-4">

                        <form id="formPublicar">
                            <div class="mb-3">
                                <label for="seccionDestino" class="form-label fw-bold">Sección de Destino</label>
                                <select class="form-select" id="seccionDestino" required>
                                    <option value="_noticias">📰 Noticias</option>
                                    <option value="_galeria">📸 Galería de Fotos</option>
                                    <option value="_literatura">📚 Literatura y Poesía</option>
                                    <option value="_documentos">📄 Documentos / Archivos</option>
                                    <option value="_humor">😄 Humor</option>
                                    <option value="_deportes">🏆 Deportes</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-bold">Título de la Publicación / Foto</label>
                                <input type="text" class="form-control" id="titulo" placeholder="Escribe un título claro..." required>
                            </div>

                            <div class="mb-3">
                                <label for="contenido" class="form-label fw-bold">Descripción o Contenido</label>
                                <textarea class="form-control" id="contenido" rows="4" placeholder="Escribe una breve descripción o texto..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="archivoFoto" class="form-label fw-bold">📁 Seleccionar imagen desde tu equipo (Opcional)</label>
                                <input type="file" class="form-control" id="archivoFoto" accept="image/*">
                                <div class="form-text">Selecciona una fotografía (JPG, PNG) directamente desde tu computador o celular.</div>
                            </div>

                            <div class="mb-3">
                                <label for="enlaceAdjunto" class="form-label fw-bold">O pega un Enlace/Adjunto web externo</label>
                                <input type="url" class="form-control" id="enlaceAdjunto" placeholder="https://ejemplo.com/archivo.pdf">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btnPublicar">
                                <i class="bi bi-rocket-takeoff-fill me-2"></i>🚀 Publicar en el Sitio Web
                            </button>
                        </form>

                        <div id="mensajeResultado" class="mt-4"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REPO_USER = 'lfuentesu';
        const REPO_NAME = 'sute-jubilados';

        document.addEventListener('DOMContentLoaded', () => {
            const tokenGuardado = localStorage.getItem('sute_github_token');
            if (tokenGuardado) {
                document.getElementById('ghToken').value = tokenGuardado;
            }
        });

        // Función para convertir archivo a Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('formPublicar').addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('ghToken').value.trim();
            const carpeta = document.getElementById('seccionDestino').value;
            const titulo = document.getElementById('titulo').value.trim();
            const contenido = document.getElementById('contenido').value.trim();
            let enlace = document.getElementById('enlaceAdjunto').value.trim();
            const inputFile = document.getElementById('archivoFoto');
            const mensajeDiv = document.getElementById('mensajeResultado');
            const btn = document.getElementById('btnPublicar');

            if (!token) {
                mensajeDiv.innerHTML = '<div class="alert alert-warning text-center">Por favor, ingresa tu Token de GitHub en la casilla superior.</div>';
                return;
            }

            localStorage.setItem('sute_github_token', token);

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando y publicando...';
            mensajeDiv.innerHTML = '';

            const timestamp = Date.now();

            try {
                // Si el usuario seleccionó un archivo local, lo subimos a GitHub en una carpeta /imagenes/
                if (inputFile.files && inputFile.files[0]) {
                    const file = inputFile.files[0];
                    const extension = file.name.split('.').pop();
                    const nombreImagen = `img_${timestamp}.${extension}`;
                    const rutaImagen = `imagenes/${nombreImagen}`;
                    const base64Image = await fileToBase64(file);

                    // Subir la imagen a GitHub
                    const resImg = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${rutaImagen}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Imagen subida: ${nombreImagen}`,
                            content: base64Image
                        })
                    });

                    if (!resImg.ok) {
                        throw new Error('Error al subir la imagen al servidor.');
                    }

                    // Usamos la URL cruda directamente de GitHub
                    enlace = `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/${rutaImagen}`;
                }

                // Generar el contenido Markdown del Post
                const hoy = new Date();
                const fechaTxt = `${hoy.getDate()}/${hoy.getMonth() + 1}/${hoy.getFullYear()}`;

                let mdContent = `# ${titulo}\n\n*Fecha:* ${fechaTxt}\n\n${contenido}`;
                
                if (enlace) {
                    if (carpeta === '_galeria' || enlace.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                        mdContent += `\n\n![${titulo}](${enlace})\n\n[Ver imagen a tamaño completo](${enlace})`;
                    } else {
                        mdContent += `\n\n[Ver adjunto / enlace relacionado](${enlace})`;
                    }
                }

                const nombreArchivo = `post_${timestamp}.md`;
                const rutaArchivo = `${carpeta}/${nombreArchivo}`;
                const base64Content = btoa(unescape(encodeURIComponent(mdContent)));

                // Subir la publicación Markdown a GitHub
                const resPost = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${rutaArchivo}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Nueva publicacion: ${titulo}`,
                        content: base64Content
                    })
                });

                if (resPost.ok) {
                    mensajeDiv.innerHTML = '<div class="alert alert-success text-center">✅ <strong>¡Publicado con éxito!</strong> El contenido y la imagen se subieron correctamente. En 1 o 2 minutos estará listo en el sitio web.</div>';
                    document.getElementById('titulo').value = '';
                    document.getElementById('contenido').value = '';
                    document.getElementById('enlaceAdjunto').value = '';
                    inputFile.value = '';
                } else {
                    const errData = await resPost.json();
                    mensajeDiv.innerHTML = `<div class="alert alert-danger text-center">❌ Error al publicar: ${errData.message || 'Verifica tu Token.'}</div>`;
                }

            } catch (err) {
                console.error(err);
                mensajeDiv.innerHTML = `<div class="alert alert-danger text-center">❌ ${err.message || 'Error de conexión.'}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-rocket-takeoff-fill me-2"></i>🚀 Publicar en el Sitio Web';
            }
        });
    </script>
</body>
</html>
