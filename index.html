<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUTE Jubilados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-header { background: linear-gradient(135deg, #0056b3, #002d62); color: white; padding: 2.5rem 1rem; text-align: center; border-bottom: 4px solid #ffc107; }
        .nav-tabs .nav-link { font-weight: 600; color: #495057; border-radius: 8px 8px 0 0; }
        .nav-tabs .nav-link.active { background-color: #ffffff; color: #0056b3; border-top: 3px solid #0056b3; }
        .card-post { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-radius: 10px; transition: transform 0.2s; }
        .card-post:hover { transform: translateY(-2px); }
        .card-post img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
        .footer { background-color: #002d62; color: white; padding: 1.5rem 0; margin-top: 3rem; }
    </style>
</head>
<body>

    <header class="hero-header mb-4">
        <div class="container">
            <h1 class="fw-bold">SUTE Jubilados</h1>
            <p class="lead mb-0">Sindicato Único de Trabajadores de la Educación - Sección Jubilados</p>
        </div>
    </header>

    <div class="container">
        <!-- Navegación por pestañas -->
        <ul class="nav nav-tabs justify-content-center mb-4" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="noticias-tab" data-bs-toggle="tab" data-bs-target="#noticias" type="button" onclick="cargarSeccion('_noticias', 'noticias-lista')">📰 Noticias</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="galeria-tab" data-bs-toggle="tab" data-bs-target="#galeria" type="button" onclick="cargarSeccion('_galeria', 'galeria-lista')">📸 Galería</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="literatura-tab" data-bs-toggle="tab" data-bs-target="#literatura" type="button" onclick="cargarSeccion('_literatura', 'literatura-lista')">📚 Literatura</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="documentos-tab" data-bs-toggle="tab" data-bs-target="#documentos" type="button" onclick="cargarSeccion('_documentos', 'documentos-lista')">📄 Documentos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="humor-tab" data-bs-toggle="tab" data-bs-target="#humor" type="button" onclick="cargarSeccion('_humor', 'humor-lista')">😄 Humor</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="deportes-tab" data-bs-toggle="tab" data-bs-target="#deportes" type="button" onclick="cargarSeccion('_deportes', 'deportes-lista')">🏆 Deportes</button>
            </li>
        </ul>

        <!-- Contenedor de Secciones -->
        <div class="tab-content" id="mainTabsContent">
            <div class="tab-pane fade show active" id="noticias" role="tabpanel"><div id="noticias-lista" class="row"></div></div>
            <div class="tab-pane fade" id="galeria" role="tabpanel"><div id="galeria-lista" class="row"></div></div>
            <div class="tab-pane fade" id="literatura" role="tabpanel"><div id="literatura-lista" class="row"></div></div>
            <div class="tab-pane fade" id="documentos" role="tabpanel"><div id="documentos-lista" class="row"></div></div>
            <div class="tab-pane fade" id="humor" role="tabpanel"><div id="humor-lista" class="row"></div></div>
            <div class="tab-pane fade" id="deportes" role="tabpanel"><div id="deportes-lista" class="row"></div></div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p class="mb-0">© SUTE Jubilados - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const REPO_USER = 'lfuentesu';
        const REPO_NAME = 'sute-jubilados';

        async function cargarSeccion(carpeta, idContenedor) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Cargando publicaciones...</p></div>';

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${carpeta}`);
                if (!res.ok) {
                    contenedor.innerHTML = '<div class="col-12 text-center text-muted py-5"><p>No hay publicaciones en esta sección aún.</p></div>';
                    return;
                }

                const archivos = await res.json();
                const archivosMd = archivos.filter(file => file.name.endsWith('.md')).reverse();

                if (archivosMd.length === 0) {
                    contenedor.innerHTML = '<div class="col-12 text-center text-muted py-5"><p>No hay publicaciones disponibles.</p></div>';
                    return;
                }

                contenedor.innerHTML = '';

                for (const archivo of archivosMd) {
                    const resContent = await fetch(archivo.download_url);
                    const text = await resContent.text();
                    
                    const cardCol = document.createElement('div');
                    cardCol.className = 'col-md-12 mb-4';
                    
                    const htmlContent = marked.parse(text);

                    cardCol.innerHTML = `
                        <div class="card card-post p-4">
                            <div class="card-body">
                                ${htmlContent}
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(cardCol);
                }
            } catch (err) {
                console.error(err);
                contenedor.innerHTML = '<div class="col-12 text-center text-danger py-5"><p>Error al cargar las publicaciones.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarSeccion('_noticias', 'noticias-lista');
        });
    </script>
</body>
</html>
