<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Páginas Amigas | SUTE-JUBILADOS</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
    header { background-color: #003366; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    header h2 { margin: 0; font-size: 1.5rem; }
    header a { color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 5px; transition: background 0.2s; }
    header a:hover { background: rgba(255,255,255,0.3); }
    main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .grid-amigas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .amiga-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid #28a745; display: flex; flex-direction: column; justify-content: space-between; }
    .amiga-title { margin: 0 0 10px 0; color: #003366; font-size: 1.2rem; }
    .amiga-desc { font-size: 0.95rem; color: #555; margin-bottom: 20px; line-height: 1.4; }
    .amiga-btn { display: inline-block; text-align: center; background-color: #003366; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
    .amiga-btn:hover { background-color: #002244; }
    .loading { text-align: center; color: #666; font-style: italic; font-size: 1.1rem; padding: 40px; }
  </style>
</head>
<body>

  <header>
    <h2>🔗 Páginas Amigas y Enlaces de Interés</h2>
    <a href="index.html">⬅️ Volver al Inicio</a>
  </header>

  <main>
    <div id="contenedor-amigas" class="grid-amigas">
      <div class="loading">Cargando enlaces...</div>
    </div>
  </main>

  <script>
    async function cargarPaginasAmigas() {
      const contenedor = document.getElementById('contenedor-amigas');
      try {
        const respuesta = await fetch('https://api.github.com/repos/lfuentesu/sute-jubilados/contents/_paginas_amigas');
        if (!respuesta.ok) throw new Error();
        const archivos = await respuesta.json();

        if (archivos.length === 0) {
          contenedor.innerHTML = '<p class="loading">No hay páginas amigas agregadas aún.</p>';
          return;
        }

        contenedor.innerHTML = '';
        for (const archivo of archivos) {
          if (archivo.name.endsWith('.md')) {
            const resArchivo = await fetch(archivo.download_url);
            const texto = await resArchivo.text();

            const tituloMatch = texto.match(/title:\s*["']?(.*?)["']?$/m);
            const urlMatch = texto.match(/url:\s*["']?(.*?)["']?$/m);
            const descMatch = texto.match(/description:\s*["']?(.*?)["']?$/m);

            const titulo = tituloMatch ? tituloMatch[1] : archivo.name;
            const url = urlMatch ? urlMatch[1] : '#';
            const desc = descMatch ? descMatch[1] : '';

            const card = document.createElement('div');
            card.className = 'amiga-card';
            card.innerHTML = `
              <div>
                <h3 class="amiga-title">${titulo}</h3>
                <p class="amiga-desc">${desc}</p>
              </div>
              <a href="${url}" target="_blank" class="amiga-btn">Visitar Sitio Web 🌐</a>
            `;
            contenedor.appendChild(card);
          }
        }
      } catch (error) {
        contenedor.innerHTML = '<p class="loading">Próximamente se listarán aquí los enlaces institucionales.</p>';
      }
    }
    cargarPaginasAmigas();
  </script>

</body>
</html>
